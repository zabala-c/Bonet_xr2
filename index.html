<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antonio Bonet | Obra Completa Argentina</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Base Architectural Styles */
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #777777;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            /* Updated to Poppins */
            font-family: 'Poppins', sans-serif;
            background-color: var(--white);
            color: var(--black);
        }

        #map {
            width: 100vw;
            height: 100vh;
            background: #e5e5e5;
        }

        /* Editorial Overlay Panel */
        .editorial-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: var(--white);
            border: 2px solid var(--black);
            padding: 24px;
            max-width: 320px;
            box-shadow: 6px 6px 0px var(--black);
        }

        .editorial-panel h1 {
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0 0 12px 0;
            line-height: 1.2;
        }

        .editorial-panel p {
            font-weight: 400;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--gray);
            margin: 0;
        }

        /* Leaflet Overrides for Minimalist / Brutalist Vibe */
        .leaflet-popup-content-wrapper {
            background: var(--white);
            color: var(--black);
            border: 2px solid var(--black);
            border-radius: 0 !important;
            box-shadow: 4px 4px 0px var(--black) !important;
            padding: 0;
        }

        .leaflet-popup-tip-container {
            display: none; 
        }

        .leaflet-popup-content {
            margin: 16px;
            /* Updated to Poppins */
            font-family: 'Poppins', sans-serif;
        }

        .popup-title {
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--black);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .popup-meta {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .popup-meta span {
            color: var(--gray);
            font-weight: 500;
        }

        /* Custom SVG Marker Animation */
        .arch-marker {
            background-color: var(--black);
            border: 2px solid var(--white);
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--black);
            transition: transform 0.2s ease;
        }
        .arch-marker:hover {
            transform: scale(1.3);
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="editorial-panel">
        <h1>Antonio Bonet<br>Obra Geolocalizada</h1>
        <p>Mapeo de proyectos y obras en Argentina. Una exploración interactiva de su legado arquitectónico.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map', {
            zoomControl: false 
        }).setView([-36.0, -58.0], 7);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const bonetData = [
            { name: "Casa de Estudios para Artistas", lat: -34.59777, lon: -58.37971, status: "Obra", year: "1938-1939", location: "Buenos Aires" },
            { name: "Casas en Mártinez", lat: -34.47832, lon: -58.49426, status: "Obra", year: "1940-1942", location: "Acassuso" },
            { name: "Casa Daneri", lat: -38.17543, lon: -57.64704, status: "Obra", year: "1940-1943", location: "Chapadmalal" },
            { name: "Casa López Llausás", lat: -34.57838, lon: -58.70955, status: "Obra", year: "1945", location: "Bella Vista" },
            { name: "Clínica Stapler", lat: -34.58645, lon: -58.40807, status: "Obra", year: "1954-1957", location: "Buenos Aires" },
            { name: "Casa Oks", lat: -34.47974, lon: -58.49043, status: "Obra", year: "1955-1957", location: "Martínez" },
            { name: "Torre y Galeria Rivadavia", lat: -37.99995, lon: -57.54853, status: "Obra", year: "1956-1957", location: "Mar del Plata" },
            { name: "Centro Comercial", lat: -34.66349, lon: -58.52101, status: "Obra", year: "1956-1958", location: "Lomas del Mirador" },
            { name: "Edificio Terraza Palace", lat: -38.02719, lon: -57.53360, status: "Obra", year: "1957", location: "Mar del Plata" },
            { name: "Edificio Viviendas y Galeria Independencia", lat: -37.99554, lon: -57.55281, status: "Obra", year: "1958", location: "Mar del Plata" },
            { name: "Galeria de Las Américas", lat: -37.99947, lon: -57.54734, status: "Obra", year: "1958", location: "Mar del Plata" },
            { name: "Proyecto sin título", lat: -34.58078, lon: -58.39218, status: "Obra", year: "1960", location: "Buenos Aires" },
            { name: "Edificio Rosales", lat: -34.57304, lon: -58.42003, status: "Proyecto", year: "1960", location: "Buenos Aires" },
            { name: "Casa en Olivos / Casa Levin", lat: -34.51772, lon: -58.48187, status: "Obra", year: "1960-1961", location: "Olivos" },
            { name: "Galeria Arax", lat: -34.60004, lon: -58.37512, status: "Obra", year: "1962", location: "Buenos Aires" }
        ];

        const archIcon = L.divIcon({
            className: 'arch-marker',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });

        const bounds = [];
        bonetData.forEach(poi => {
            const popupContent = `
                <div class="popup-title">${poi.name}</div>
                <div class="popup-meta">Status: <span>${poi.status}</span></div>
                <div class="popup-meta">Año: <span>${poi.year}</span></div>
                <div class="popup-meta" style="margin-top: 8px;">📍 ${poi.location}</div>
            `;

            L.marker([poi.lat, poi.lon], { icon: archIcon })
                .bindPopup(popupContent, { offset: [0, -5] })
                .addTo(map);
            
            bounds.push([poi.lat, poi.lon]);
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50] });
        }
    </script>
</body>
</html>
