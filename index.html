<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link
    rel="iframely"
    href="https://zabala-c.github.io/Bonet_xr2/"
>
    <meta property="og:title" content="Antonio Bonet | Obra Completa Argentina">
    <meta property="og:description" content="Mapeo interactivo de proyectos y obras de Antonio Bonet en Argentina.">
    <meta property="og:type" content="website">

    <title>Antonio Bonet | Obra Completa Argentina</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #777777;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: var(--white);
            color: var(--black);
            overflow: hidden; /* Prevents scrollbars in iframes */
        }

        #map {
            width: 100%;
            height: 100%;
            background: #e5e5e5;
        }

        /* Editorial Overlay Panel - Embed Optimized */
        .editorial-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--white);
            border: 2px solid var(--black);
            padding: 20px;
            max-width: 280px;
            box-shadow: 6px 6px 0px var(--black);
            pointer-events: auto;
        }

        .editorial-panel h1 {
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 10px 0;
            line-height: 1.2;
        }

        .editorial-panel p {
            font-weight: 400;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--gray);
            margin: 0;
        }

        /* Responsive adjustments for small Canva embed frames */
        @media (max-width: 600px), (max-height: 500px) {
            .editorial-panel {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                padding: 12px;
                box-shadow: 4px 4px 0px var(--black);
            }
            .editorial-panel h1 {
                font-size: 0.9rem;
                margin-bottom: 5px;
            }
            .editorial-panel p {
                display: none; /* Hide description in tiny frames to save map space */
            }
            .leaflet-control-zoom {
                display: none; /* Hide zoom controls on tiny mobile/embed frames */
            }
        }

        /* Leaflet Overrides */
        .leaflet-popup-content-wrapper {
            background: var(--white);
            color: var(--black);
            border: 2px solid var(--black);
            border-radius: 0 !important;
            box-shadow: 4px 4px 0px var(--black) !important;
            padding: 0;
        }

        .leaflet-popup-tip-container {
            display: none; 
        }

        .leaflet-popup-content {
            margin: 12px;
            font-family: 'Poppins', sans-serif;
            min-width: 180px;
        }

        .popup-title {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--black);
            padding-bottom: 6px;
            margin-bottom: 6px;
        }

        .popup-meta {
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .popup-meta span {
            color: var(--gray);
            font-weight: 500;
        }

        .arch-marker {
            background-color: var(--black);
            border: 2px solid var(--white);
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--black);
            transition: transform 0.2s ease;
        }
        
        .arch-marker:hover {
            transform: scale(1.3);
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="editorial-panel">
        <h1>Antonio Bonet<br>Obra Geolocalizada</h1>
        <p>Mapeo de proyectos y obras en Argentina.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map', {
            zoomControl: false,
            scrollWheelZoom: false // Better for embeds so the user doesn't accidentally zoom when scrolling the Canva page
        }).setView([-36.0, -58.0], 6);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const bonetData = [
            { name: "Casa de Estudios para Artistas", lat: -34.59777, lon: -58.37971, status: "Obra", year: "1938-1939", location: "Buenos Aires" },
            { name: "Casas en Mártinez", lat: -34.47832, lon: -58.49426, status: "Obra", year: "1940-1942", location: "Acassuso" },
            { name: "Casa Daneri", lat: -38.17543, lon: -57.64704, status: "Obra", year: "1940-1943", location: "Chapadmalal" },
            { name: "Casa López Llausás", lat: -34.57838, lon: -58.70955, status: "Obra", year: "1945", location: "Bella Vista" },
            { name: "Clínica Stapler", lat: -34.58645, lon: -58.40807, status: "Obra", year: "1954-1957", location: "Buenos Aires" },
            { name: "Casa Oks", lat: -34.47974, lon: -58.49043, status: "Obra", year: "1955-1957", location: "Martínez" },
            { name: "Torre y Galeria Rivadavia", lat: -37.99995, lon: -57.54853, status: "Obra", year: "1956-1957", location: "Mar del Plata" },
            { name: "Centro Comercial", lat: -34.66349, lon: -58.52101, status: "Obra", year: "1956-1958", location: "Lomas del Mirador" },
            { name: "Edificio Terraza Palace", lat: -38.02719, lon: -57.53360, status: "Obra", year: "1957", location: "Mar del Plata" },
            { name: "Edificio Viviendas y Galeria Independencia", lat: -37.99554, lon: -57.55281, status: "Obra", year: "1958", location: "Mar del Plata" },
            { name: "Galeria de Las Américas", lat: -37.99947, lon: -57.54734, status: "Obra", year: "1958", location: "Mar del Plata" },
            { name: "Proyecto sin título", lat: -34.58078, lon: -58.39218, status: "Obra", year: "1960", location: "Buenos Aires" },
            { name: "Edificio Rosales", lat: -34.57304, lon: -58.42003, status: "Proyecto", year: "1960", location: "Buenos Aires" },
            { name: "Casa en Olivos / Casa Levin", lat: -34.51772, lon: -58.48187, status: "Obra", year: "1960-1961", location: "Olivos" },
            { name: "Galeria Arax", lat: -34.60004, lon: -58.37512, status: "Obra", year: "1962", location: "Buenos Aires" }
        ];

        const archIcon = L.divIcon({
            className: 'arch-marker',
            iconSize: [12, 12],
            iconAnchor: [6, 6]
        });

        const bounds = [];
        bonetData.forEach(poi => {
            const popupContent = `
                <div class="popup-title">${poi.name}</div>
                <div class="popup-meta">Status: <span>${poi.status}</span></div>
                <div class="popup-meta">Año: <span>${poi.year}</span></div>
                <div class="popup-meta" style="margin-top: 6px;">📍 ${poi.location}</div>
            `;

            L.marker([poi.lat, poi.lon], { icon: archIcon })
                .bindPopup(popupContent, { offset: [0, -5] })
                .addTo(map);
            
            bounds.push([poi.lat, poi.lon]);
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [30, 30] });
        }
    </script>
</body>
</html>
